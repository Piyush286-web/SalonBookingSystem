<!DOCTYPE html>
<html>

<head>

    <title>Salon Booking System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Salon Booking System</h1>


        <form id="bookingForm">

            <!-- NAME -->

            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <!-- PHONE -->

            <label>Phone</label>

            <input
                type="text"
                id="phone"
                placeholder="Enter phone number"
            >


            <!-- EMAIL -->

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
            >


            <!-- SERVICES -->

            <label>Select Services</label>

            <div class="services">

                <label>
                    <input
                        type="checkbox"
                        name="service"
                        value="1"
                        data-price="300"
                    >
                    Haircut - ₹300
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="service"
                        value="2"
                        data-price="800"
                    >
                    Hair Spa - ₹800
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="service"
                        value="3"
                        data-price="600"
                    >
                    Facial - ₹600
                </label>


                <label>
                    <input
                        type="checkbox"
                        name="service"
                        value="4"
                        data-price="1200"
                    >
                    Hair Coloring - ₹1200
                </label>

            </div>


            <!-- TOTAL PRICE -->

            <p id="totalPrice">
                Total: ₹0
            </p>


            <!-- APPOINTMENT DATE -->

            <label>Appointment Date</label>

            <input
                type="date"
                id="date"
            >


            <!-- APPOINTMENT TIME -->

            <label>Appointment Time</label>

            <input
                type="time"
                id="time"
            >


            <!-- BOOK BUTTON -->

            <button type="submit">
                Book Appointment
            </button>

        </form>


        <!-- MESSAGE -->

        <p id="message"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
